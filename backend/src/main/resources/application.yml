spring:
  application:
    name: ArtNara

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    # 기본값: H2 파일 모드 — 서버를 재시작해도 데이터(계정·거래·소유권)가 유지된다.
    # DB 파일은 사용자 홈(~/artnara-db)에 둔다. 레포(OneDrive 동기화 경로)에 두면
    # 동기화가 파일을 잠가 DB가 깨질 수 있다.
    # 운영/MySQL 전환은 코드 수정 없이 환경변수로:
    #   DB_URL=jdbc:mysql://localhost:3306/artnara DB_DRIVER=com.mysql.cj.jdbc.Driver
    #   DB_USERNAME=... DB_PASSWORD=... DDL_AUTO=update
    url: ${DB_URL:jdbc:h2:file:~/artnara-db/artnara;MODE=MYSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # update: 기존 데이터를 지우지 않고 스키마 변경분만 반영 (영구 DB 전제)
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      data-locations: classpath:test.sql
      # test.sql 은 UTF-8 이라 플랫폼 기본 인코딩(MS949)으로 읽으면 한글이 깨진다
      encoding: UTF-8

jwt:
  issuer: ${JWT_ISSUER:artnara}
  secret: ${JWT_SECRET:YXJ0bmFyYS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbg==}
  access-token-validity: ${JWT_ACCESS_TTL:1h}
  refresh-token-validity: ${JWT_REFRESH_TTL:14d}

auth:
  # 로컬 테스트 전용: 값을 넣으면 토큰 검증 없이 해당 userId로 모든 요청이 인증된다.
  # 절대 운영 환경에 설정하지 말 것. 비워두면(기본값) 평소처럼 정상 검증한다.
  dev-bypass-user-id: ${AUTH_DEV_BYPASS_USER_ID:}

oauth:
  google:
    # 설정 시 구글 idToken의 aud(클라이언트 ID) 검증. 비어 있으면 검증을 건너뜁니다.
    client-id: ${GOOGLE_CLIENT_ID:}
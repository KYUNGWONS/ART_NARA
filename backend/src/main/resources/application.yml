# 운영은 리버스 프록시(nginx 등)에서 TLS 를 끊고 앱 서버로 넘긴다.
# 그러면 Spring 이 보는 스킴은 http 라서, 프록시가 붙여 준 X-Forwarded-* 를 신뢰해야
# 리다이렉트·절대 URL·쿠키 secure 판정이 https 기준으로 맞는다.
server:
  forward-headers-strategy: ${FORWARD_HEADERS:framework}

spring:
  application:
    name: ArtNara

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    # 기본값: H2 파일 모드 — 서버를 재시작해도 데이터(계정·거래·소유권)가 유지된다.
    # DB 파일은 사용자 홈(~/artnara-db)에 둔다. 레포(OneDrive 동기화 경로)에 두면
    # 동기화가 파일을 잠가 DB가 깨질 수 있다.
    # 운영/MySQL 전환은 코드 수정 없이 환경변수로:
    #   DB_URL=jdbc:mysql://localhost:3306/artnara DB_DRIVER=com.mysql.cj.jdbc.Driver
    #   DB_USERNAME=... DB_PASSWORD=... DDL_AUTO=update
    url: ${DB_URL:jdbc:h2:file:~/artnara-db/artnara;MODE=MYSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # update: 기존 데이터를 지우지 않고 스키마 변경분만 반영 (영구 DB 전제)
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      data-locations: classpath:test.sql
      # test.sql 은 UTF-8 이라 플랫폼 기본 인코딩(MS949)으로 읽으면 한글이 깨진다
      encoding: UTF-8

jwt:
  issuer: ${JWT_ISSUER:artnara}
  secret: ${JWT_SECRET:YXJ0bmFyYS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbg==}
  access-token-validity: ${JWT_ACCESS_TTL:1h}
  refresh-token-validity: ${JWT_REFRESH_TTL:14d}

auth:
  # 로컬 테스트 전용: 값을 넣으면 토큰 검증 없이 해당 userId로 모든 요청이 인증된다.
  # 절대 운영 환경에 설정하지 말 것. 비워두면(기본값) 평소처럼 정상 검증한다.
  dev-bypass-user-id: ${AUTH_DEV_BYPASS_USER_ID:}

# 토스페이먼츠 — 시크릿 키가 있으면 실제 결제 승인/취소를 호출하고,
# 비어 있으면 mock 결제로 동작한다(로컬 개발 기본값).
# 아래 기본값은 토스 공개 문서의 테스트 키라 실제 돈이 빠지지 않는다.
# 운영에서는 반드시 TOSS_SECRET_KEY 환경변수로 계약 키를 주입할 것.
# 푸시 알림. 서비스 계정 JSON 경로를 주면 켜지고, 없으면 앱 내 알림만 쌓인다.
fcm:
  credentials-path: ${FCM_CREDENTIALS:}

toss:
  secret-key: ${TOSS_SECRET_KEY:}
  client-key: ${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}

# 소셜 로그인(카카오·네이버)은 앱이 받은 액세스 토큰을 서버가 프로필 조회로 검증하므로
# 서버 쪽에 별도 클라이언트 설정이 필요 없다.